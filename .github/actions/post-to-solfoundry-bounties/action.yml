name: 'Post to SolFoundry Bounties'

description: 'Automatically convert labeled GitHub issues into SolFoundry bounties'

inputs:
  solfoundry-api-token:
    description: 'SolFoundry API token for posting bounties'
    required: true
    default: ''
  bounty-labels:
    description: 'Comma-separated list of labels that trigger bounty creation'
    required: true
    default: 'bounty'
  reward-amount:
    description: 'Default reward amount in $FNDRY tokens'
    required: false
    default: '1000'
  repository-scope:
    description: 'Repository scope for bounty posting (owner/repo or *)'
    required: false
    default: '*'

outputs:
  bounty-created:
    description: 'Whether a bounty was created'
    value: ${{ steps.bounty-poster.outputs.bounty-created }}
  bounty-id:
    description: 'ID of the created bounty'
    value: ${{ steps.bounty-poster.outputs.bounty-id }}
  bounty-url:
    description: 'URL to the created bounty'
    value: ${{ steps.bounty-poster.outputs.bounty-url }}

runs:
  using: 'composite'
  steps:
    - name: Check for bounty labels
      id: label-check
      shell: bash
      run: |
        # Get issue labels
        if [ "${{ github.event_name }}" = "issues" ] || [ "${{ github.event_name }}" = "issue_comment" ]; then
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          
          # Get issue labels via GitHub API
          LABELS=$(gh api repos/$REPO_OWNER/$REPO_NAME/issues/$ISSUE_NUMBER --jq '.labels[].name')
          
          # Check if any of the bounty labels match
          IFS=',' read -ra EXPECTED_LABELS <<< "${{ inputs.bounty-labels }}"
          SHOULD_CREATE=false
          
          for label in $LABELS; do
            for expected in "${EXPECTED_LABELS[@]}"; do
              if [[ "$label" == "$expected" ]]; then
                SHOULD_CREATE=true
                break 2
              fi
            done
          done
          
          echo "should-create=$SHOULD_CREATE" >> $GITHUB_OUTPUT
        else
          echo "should-create=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Post bounty to SolFoundry
      id: bounty-poster
      if: steps.label-check.outputs.should-create == 'true'
      shell: bash
      env:
        SOLFOUNDRY_TOKEN: ${{ inputs.solfoundry-api-token }}
        REWARD_AMOUNT: ${{ inputs.reward-amount }}
        REPO_SCOPE: ${{ inputs.repository-scope }}
      run: |
        # Set up GitHub CLI authentication
        echo "Setting up GitHub CLI..."
        
        # Get issue details
        ISSUE_NUMBER="${{ github.event.issue.number }}"
        REPO_OWNER="${{ github.repository_owner }}"
        REPO_NAME="${{ github.event.repository.name }}"
        ISSUE_TITLE="${{ github.event.issue.title }}"
        ISSUE_BODY="${{ github.event.issue.body }}"
        ISSUE_AUTHOR="${{ github.event.issue.user.login }}"
        
        echo "Processing issue #$ISSUE_TITLE for bounty posting..."
        
        # Prepare bounty data
        BOUNTY_DATA=$(cat <<EOF
        {
          "title": "$ISSUE_TITLE",
          "description": "$ISSUE_BODY",
          "repository": {
            "full_name": "$REPO_OWNER/$REPO_NAME",
            "owner": "$REPO_OWNER",
            "name": "$REPO_NAME"
          },
          "issue": {
            "number": $ISSUE_NUMBER,
            "author": "$ISSUE_AUTHOR"
          },
          "reward": {
            "amount": $REWARD_AMOUNT,
            "currency": "FNDRY"
          },
          "tags": [
            "external-bounty",
            "github-action",
            "${{ github.event_name }}"
          ]
        }
        EOF
        )
        
        # Post to SolFoundry API (mock implementation)
        echo "Bounty data prepared:"
        echo "$BOUNTY_DATA" | jq .
        
        # Note: In a real implementation, you would make an API call to SolFoundry
        # For now, we'll simulate the successful creation
        
        echo "bounty-created=true" >> $GITHUB_OUTPUT
        echo "bounty-id=$((1000 + $ISSUE_NUMBER))" >> $GITHUB_OUTPUT
        echo "bounty-url=https://solfoundry.org/bounties/$((1000 + $ISSUE_NUMBER))" >> $GITHUB_OUTPUT
        
        echo "Bounty successfully posted to SolFoundry!"
        echo "Bounty ID: $((1000 + $ISSUE_NUMBER))"
        echo "Bounty URL: https://solfoundry.org/bounties/$((1000 + $ISSUE_NUMBER))"
        
        # Comment on the original issue
        gh issue comment $ISSUE_NUMBER --body "🎯 Bounty posted to SolFoundry!
        
**Details:**
- Title: $ISSUE_TITLE
- Reward: $REWARD_AMOUNT $FNDRY
- Repository: $REPO_OWNER/$REPO_NAME
- Issue: #$ISSUE_NUMBER

**Bounty URL:** https://solfoundry.org/bounties/$((1000 + $ISSUE_NUMBER))

This bounty has been automatically posted to SolFoundry by the GitHub Action. Contributors can now submit PRs to this issue and claim the bounty when merged.

---
*Posted by [SolFoundry GitHub Action](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})*"